# art-galleries 정적 서빙 nginx 설정 (apps/serve.json 미러)
#
# 라우팅 규칙은 apps/serve.json 과 동일한 의도:
#   - cleanUrls:false → 확장자 없는 경로를 .html 로 매핑
#   - 허브(/)           → /index.html
#   - /chicago-museum   → /chicago-museum/index.html
#   - /chicago-museum/search → /chicago-museum/search.html  (artwork, favorites 동일)
#   - metropolitan / cleveland / vna-east 박물관도 같은 패턴
#
# trailing-slash 301 회피: try_files 에서 $uri/index.html 을 bare $uri 보다 먼저
# 시도해, 디렉토리 요청이 "/path → /path/" 301 로 리다이렉트되지 않게 한다.
# (mistake-history: 캐시된 301 리다이렉트 이슈 재발 방지)

server {
    listen 3100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 공용 cloudflared / deploy.sh 헬스체크용
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # 키가 필요한 박물관 API 는 키 프록시 컨테이너로 동일 출처 전달(키 비노출, CORS 불필요).
    # 예: /api/harvard/object?... → proxy:8080/harvard/object?... → Harvard API(+apikey)
    # 변수 proxy_pass + resolver 로 런타임 DNS 해석(프록시 기동 순서에 견고).
    location ~ ^/api/harvard/(.*)$ {
        resolver 127.0.0.11 valid=30s;
        set $proxy_upstream http://art-galleries-proxy:8080;
        proxy_pass $proxy_upstream/harvard/$1$is_args$args;
        proxy_set_header Host $host;
    }

    # e뮤지엄(국립박물관 통합) API 도 동일 패턴으로 키 프록시 경유(키 비노출).
    # 예: /api/emuseum/relic/list?... → proxy:8080/emuseum/relic/list?... → e뮤지엄 API(+serviceKey)
    location ~ ^/api/emuseum/(.*)$ {
        resolver 127.0.0.11 valid=30s;
        set $proxy_upstream http://art-galleries-proxy:8080;
        proxy_pass $proxy_upstream/emuseum/$1$is_args$args;
        proxy_set_header Host $host;
    }

    # 개인전: /show/<유저> → show 앱 단일 페이지(유저는 JS가 경로에서 파싱).
    # 동적 유저라 정적 매핑 불가 → /show/* 와 /show 는 항상 show/index.html 서빙.
    location ^~ /show/ {
        try_files /show/index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /show {
        try_files /show/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        # 디렉토리 → index.html, 확장자 없는 경로 → .html, 그 외 실제 파일 순으로 해석.
        try_files $uri/index.html $uri.html $uri =404;
        # HTML/자원이 301 과 함께 캐시되어 굳는 문제 방지 — 항상 재검증.
        add_header Cache-Control "no-cache";
    }
}
