# art-galleries 정적 서빙 nginx 설정 (apps/serve.json 미러)
#
# 라우팅 규칙은 apps/serve.json 과 동일한 의도:
#   - cleanUrls:false → 확장자 없는 경로를 .html 로 매핑
#   - 허브(/)           → /index.html
#   - /chicago-museum   → /chicago-museum/index.html
#   - /chicago-museum/search → /chicago-museum/search.html  (artwork, favorites 동일)
#   - metropolitan / cleveland / vna-east 박물관도 같은 패턴
#
# trailing-slash 301 회피: try_files 에서 $uri/index.html 을 bare $uri 보다 먼저
# 시도해, 디렉토리 요청이 "/path → /path/" 301 로 리다이렉트되지 않게 한다.
# (mistake-history: 캐시된 301 리다이렉트 이슈 재발 방지)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 공용 cloudflared / deploy.sh 헬스체크용
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        # 디렉토리 → index.html, 확장자 없는 경로 → .html, 그 외 실제 파일 순으로 해석.
        try_files $uri/index.html $uri.html $uri =404;
        # HTML/자원이 301 과 함께 캐시되어 굳는 문제 방지 — 항상 재검증.
        add_header Cache-Control "no-cache";
    }
}
