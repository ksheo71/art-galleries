<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>국립박물관 소장품 — e뮤지엄</title>
  <meta name="description" content="국립중앙박물관 등 국립박물관 통합 소장품(e뮤지엄)을 이미지와 함께 검색·감상하세요."/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-gray-900 min-h-screen flex flex-col" style="background-image:linear-gradient(rgba(248,248,248,0.80),rgba(248,248,248,0.86)),url('/assets/hero/emuseum.jpg');background-size:cover;background-position:center;background-attachment:fixed;">
  <header class="bg-white border-b sticky top-0 z-30">
    <div class="container mx-auto px-4 py-3 flex items-center gap-3">
      <div class="flex items-center gap-2 whitespace-nowrap">
        <a href="../index.html" class="text-xs text-gray-500 hover:underline" title="허브로">Hub</a>
        <span class="text-gray-300">·</span>
        <a href="./index.html" class="font-bold text-lg">e뮤지엄</a>
      </div>
      <div class="flex-1"></div>
      <label for="search" class="sr-only">소장품 이름 검색</label>
      <input id="search" type="search" placeholder="예: 청자, 백제, 금관…"
        class="w-44 sm:w-72 border border-gray-300 rounded px-3 py-2 text-sm"/>
    </div>
  </header>

  <main class="flex-1 container mx-auto px-4 py-6">
    <section class="relative text-center py-14 md:py-24 -mx-4 px-4 mb-8 rounded-b-2xl overflow-hidden bg-cover bg-center" style="background-image:url('/assets/hero/emuseum.jpg')">
      <div class="absolute inset-0 bg-black/55"></div>
      <div class="relative">
      <p class="text-xs uppercase tracking-[0.25em] text-white/75">국립박물관 · e-Museum</p>
      <h1 class="mt-2 text-3xl md:text-5xl font-bold tracking-tight text-white drop-shadow-lg">국립박물관 소장품</h1>
      <p class="mt-3 text-white/85">국립중앙박물관을 비롯한 <strong>국립박물관 통합 소장품</strong>을 이미지와 함께.</p>
      <p id="summary" class="mt-1 text-sm text-white/70"></p>
      </div>
    </section>

    <section aria-label="소장품 목록">
      <div id="status" class="text-center text-gray-500 py-16">불러오는 중…</div>
      <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
      <div id="more-wrap" class="hidden text-center mt-8">
        <button id="more-btn" class="px-6 py-2.5 rounded-full border border-indigo-300 text-indigo-800 hover:bg-indigo-50 text-sm font-medium">더 보기</button>
      </div>
    </section>
  </main>

  <footer class="border-t py-6 text-center text-sm text-gray-500">
    자료 출처:
    <a href="https://www.emuseum.go.kr" class="underline" target="_blank" rel="noopener">e뮤지엄(emuseum.go.kr)</a>
    · 국립중앙박물관 외 · 공공누리(항목별 유형 상이) — 출처표시 후 이용
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
