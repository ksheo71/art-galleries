# art-galleries 맥미니 상시 운영 — 정적 프론트엔드(nginx)
#
# pdfsnap 패턴과 동일하게 공용 Cloudflare Tunnel(edge_shared)에 합류한다.
# 이 사이트는 순수 정적(빌드 없음)이므로 stock nginx 이미지에 apps/ 를 read-only
# 바인드 마운트해서 서빙한다. Dockerfile 빌드 불필요 → 배포 = git pull 만으로 즉시 반영.
#
# 외부 노출은 컨테이너 포트 발행이 아니라, 공용 cloudflared 가 edge_shared 안에서
# art-galleries-frontend:3100 으로 라우팅한다(Cloudflare Zero Trust 대시보드 Public Hostname).
#
# 사용:
#   docker compose -f docker-compose.yml up -d
services:
  frontend:
    image: nginx:alpine
    container_name: art-galleries-frontend
    restart: unless-stopped
    # nginx 는 컨테이너 내부 3100 수신.
    # - expose: edge_shared 내부망(cloudflared)에서 접근 → 외부 공개 경로
    # - ports : 맥미니 호스트로 발행 → 로컬 http://localhost:3100 접근용
    #   (LAN 노출 없이 호스트 로컬만 원하면 "127.0.0.1:3100:3100" 으로 변경)
    expose:
      - "3100"
    ports:
      - "3100:3100"
    volumes:
      - ./apps:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge_shared

# 공용 cloudflared compose 가 생성/소유하는 외부 네트워크에 합류한다.
networks:
  edge_shared:
    name: edge_shared
    external: true
