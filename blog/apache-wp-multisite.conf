# WordPress 멀티사이트(서브디렉토리) rewrite.
# 주의: 이미지의 docker-php.conf 가 /var/www/ 에 AllowOverride All 을 켜서,
# /var/www/html/.htaccess(싱글사이트용, 접두사 제거 규칙 없음)가 아래 멀티사이트
# 규칙을 덮어써 서브블로그 wp-admin/wp-login 이 무한 리다이렉트됐다.
# → 여기서 AllowOverride None 으로 .htaccess 를 끄고, 멀티사이트 규칙을 <Directory>
#   컨텍스트로 강제한다(영속: 이 파일을 conf-enabled 로 마운트).
<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteBase /
    RewriteRule ^index\.php$ - [L]
    # /wp-admin 트레일링 슬래시
    RewriteRule ^([_0-9a-zA-Z-]+/)?wp-admin$ $1wp-admin/ [R=301,L]
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^([_0-9a-zA-Z-]+/)?(wp-(content|admin|includes).*) $2 [L]
    RewriteRule ^([_0-9a-zA-Z-]+/)?(.*\.php)$ $2 [L]
    RewriteRule . index.php [L]
</Directory>
